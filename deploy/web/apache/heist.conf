# Render with heist.rollout.web_proxy; install only during checked maintenance.
<VirtualHost @BIND@>
    ServerName @SERVER_NAME@
    DocumentRoot "@WEB_ROOT@"
    SSLEngine on
    SSLCertificateFile "@CERTIFICATE@"
    SSLCertificateKeyFile "@CERTIFICATE_KEY@"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset X-Forwarded-Prefix
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/api/" "http://127.0.0.1:@API_PORT@/api/" connectiontimeout=3 timeout=1900 retry=0
    ProxyPassReverse "/api/" "http://127.0.0.1:@API_PORT@/api/"
    RedirectMatch 308 "^/api$" "/api/"

    <Directory "@WEB_ROOT@">
        Options -Indexes -Includes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py)$">
            Require all denied
        </FilesMatch>
        <Files "index.html">
            Header always set Cache-Control "no-store"
        </Files>
    </Directory>
    <Location "/api/">
        LimitRequestBody 5242880
    </Location>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
</VirtualHost>

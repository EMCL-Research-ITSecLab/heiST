[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heiST"
version = "0.2.0"
description = "heiST automation and backend tooling"
requires-python = ">=3.12"

[project.scripts]
heist = "heist.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "automatic_challenge_import*",
    "backend*",
    "monitoring*",
    "setup*",
    "heist*",
    "tools*",
    "automatic_ova_setup*",
]
exclude = [
    "tests*",
    "**.__pycache__*",
]


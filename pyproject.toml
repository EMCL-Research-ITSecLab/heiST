[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heiST"
version = "0.3.0"
description = "heiST automation and backend tooling"
requires-python = ">=3.12"

[project.scripts]
heist = "heist.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["heist*"]

exclude = [
    "tests*",
    "heist.backend.tests*",
    "**.__pycache__*",
]

[tool.setuptools.package-data]
"heist.installer" = ["requirements.txt"]
"heist.monitoring" = ["**/*.sql", "**/*.json", "**/*.toml", "**/*.xml", "**/*.yml", "**/*.sh", "**/*.ps1", "**/*.service", "**/*.timer", "**/localfile_*"]
